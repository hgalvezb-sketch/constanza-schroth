<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constanza · Ejercicios Schroth Animados</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #0f0a1e;
  color: #e0e0e0;
  overflow: hidden;
}

#splash {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #0f0a1e 0%, #1a0f2e 50%, #2d1b4e 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.8s ease-out;
}

#splash.hide {
  opacity: 0;
  pointer-events: none;
}

.splash-content {
  text-align: center;
  max-width: 500px;
  padding: 40px;
}

.splash-content h1 {
  font-size: 48px;
  font-weight: 700;
  background: linear-gradient(135deg, #7c3aed, #c084fc, #e879f9);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 16px;
}

.splash-subtitle {
  font-size: 18px;
  color: #a78bfa;
  margin-bottom: 32px;
}

.progress-container {
  width: 100%;
  height: 6px;
  background: #2d1b4e;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 16px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, #7c3aed, #c084fc, #e879f9);
  width: 0%;
  transition: width 0.3s;
  border-radius: 10px;
}

.loading-text {
  font-size: 14px;
  color: #c084fc;
  font-weight: 600;
}

#app { display: flex; flex-direction: column; height: 100vh; }

header {
  background: linear-gradient(135deg, #1a0f2e, #2d1b4e);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #3d2b5e;
}

.header-left { display: flex; align-items: center; gap: 16px; }
.header-left h1 {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg, #7c3aed, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.progress-dots { display: flex; gap: 6px; }
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #2d1b4e;
  transition: all 0.3s;
  cursor: pointer;
}
.dot:hover { transform: scale(1.2); }
.dot.active { background: #7c3aed; box-shadow: 0 0 12px #7c3aed; }
.dot.completed { background: #10b981; box-shadow: 0 0 12px #10b981; }

.header-stats { display: flex; gap: 12px; }
.stat {
  font-size: 13px;
  padding: 6px 14px;
  background: #1a0f2e;
  border-radius: 16px;
  border: 1px solid #3d2b5e;
}
.stat.completed-stat { color: #10b981; border-color: #10b981; }
.stat.streak-stat { color: #c084fc; border-color: #7c3aed; }

#canvas-container { flex: 1; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; }

#hud {
  position: absolute;
  top: 24px;
  left: 24px;
  background: rgba(15, 10, 30, 0.9);
  backdrop-filter: blur(16px);
  padding: 20px 24px;
  border-radius: 20px;
  border: 1px solid rgba(124, 58, 237, 0.4);
  max-width: 360px;
  pointer-events: none;
}

.hud-exercise {
  font-size: 22px;
  font-weight: 700;
  color: #c084fc;
  margin-bottom: 10px;
}

.hud-phase {
  font-size: 15px;
  color: #a78bfa;
  margin-bottom: 14px;
}

.hud-breathing {
  font-size: 17px;
  font-weight: 600;
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 14px;
  text-align: center;
}
.hud-breathing.inhale {
  background: rgba(16, 185, 129, 0.25);
  color: #10b981;
  border: 1px solid rgba(16, 185, 129, 0.4);
}
.hud-breathing.exhale {
  background: rgba(251, 146, 60, 0.25);
  color: #fb923c;
  border: 1px solid rgba(251, 146, 60, 0.4);
}

.hud-timer {
  font-size: 38px;
  font-weight: 700;
  color: #7c3aed;
  text-align: center;
}

#controls {
  position: absolute;
  top: 24px;
  right: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ctrl-btn {
  padding: 12px 18px;
  background: rgba(15, 10, 30, 0.9);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(124, 58, 237, 0.4);
  border-radius: 14px;
  color: #c084fc;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
}

.ctrl-btn:hover {
  background: rgba(124, 58, 237, 0.3);
  border-color: #7c3aed;
  transform: translateY(-2px);
}

.ctrl-btn.active {
  background: rgba(124, 58, 237, 0.5);
  border-color: #7c3aed;
}

.ctrl-btn.complete {
  background: rgba(16, 185, 129, 0.3);
  border-color: #10b981;
  color: #10b981;
}

.nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 48px;
  color: rgba(192, 132, 252, 0.6);
  cursor: pointer;
  padding: 20px;
  user-select: none;
  transition: all 0.3s;
  z-index: 10;
}

.nav-arrow:hover {
  color: #c084fc;
  transform: translateY(-50%) scale(1.2);
}

.nav-arrow.left { left: 20px; }
.nav-arrow.right { right: 20px; }

#bottom-panel {
  background: linear-gradient(180deg, rgba(26, 15, 46, 0.95), rgba(45, 27, 78, 0.95));
  backdrop-filter: blur(12px);
  border-top: 1px solid rgba(124, 58, 237, 0.3);
  transition: transform 0.3s;
  max-height: 35vh;
  display: flex;
  flex-direction: column;
}

#bottom-panel.collapsed {
  transform: translateY(calc(100% - 60px));
}

.panel-handle {
  padding: 16px 24px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.panel-title {
  font-size: 18px;
  font-weight: 700;
  color: #c084fc;
}

.panel-subtitle {
  font-size: 13px;
  color: #a78bfa;
  margin-left: 12px;
}

.panel-toggle {
  font-size: 20px;
  color: #7c3aed;
  transition: transform 0.3s;
}

#bottom-panel.collapsed .panel-toggle {
  transform: rotate(180deg);
}

.panel-content {
  padding: 0 24px 20px;
  overflow-y: auto;
  flex: 1;
}

.exercise-description {
  color: #d8b4fe;
  line-height: 1.6;
  margin-bottom: 16px;
  font-size: 14px;
}

.steps-list {
  padding-left: 20px;
}

.steps-list li {
  color: #e0e0e0;
  line-height: 1.8;
  margin-bottom: 8px;
  font-size: 14px;
}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-content">
    <h1>Constanza 💜</h1>
    <p class="splash-subtitle">Cargando modelo 3D animado...</p>
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="loading-text" id="loading-text">Iniciando...</div>
  </div>
</div>

<div id="app" style="opacity:0">
  <header>
    <div class="header-left">
      <h1>Constanza</h1>
      <div class="progress-dots" id="progress-dots"></div>
    </div>
    <div class="header-stats">
      <div class="stat completed-stat" id="progress-stat">0/8 hoy</div>
      <div class="stat streak-stat" id="streak-stat">0 días</div>
      <div class="stat">←→ SPACE R F</div>
    </div>
  </header>

  <div id="canvas-container">
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div class="hud-exercise" id="hud-exercise">Ejercicio</div>
      <div class="hud-phase" id="hud-phase">Fase 1 de 4</div>
      <div class="hud-breathing" id="hud-breathing"></div>
      <div class="hud-timer" id="hud-timer">10:00</div>
    </div>

    <div id="controls">
      <button class="ctrl-btn" id="pause-btn" onclick="togglePause()">⏸ Pausar</button>
      <button class="ctrl-btn" id="complete-btn" onclick="markComplete()">✓ Completar</button>
      <button class="ctrl-btn" id="reset-btn" onclick="resetCamera()">↻ Reset</button>
    </div>

    <div class="nav-arrow left" onclick="previousExercise()">‹</div>
    <div class="nav-arrow right" onclick="nextExercise()">›</div>

    <div id="bottom-panel">
      <div class="panel-handle" onclick="togglePanel()">
        <div>
          <span class="panel-title" id="panel-title">Ejercicio</span>
          <span class="panel-subtitle" id="panel-subtitle"></span>
        </div>
        <span class="panel-toggle">▼</span>
      </div>
      <div class="panel-content">
        <p class="exercise-description" id="exercise-description"></p>
        <ol class="steps-list" id="steps-list"></ol>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>
const EXERCISES = [
  {name:"Elongación Axial",pos:"De pie",lv:"Básico",desc:"Base del método. Imagina hilo desde coronilla.",steps:["Párate frente al espejo","Imagina hilo tirando arriba","Crece sin ponerte de puntas","Activa abdomen 30%"],breathing:["","INHALA — crece","Mantén","EXHALA — sostén"],pose:"stand"},
  {name:"Cilindro Muscular",pos:"Contra pared",lv:"Intermedio",desc:"Brazo izq arriba, der a 90°. Desplaza costillas.",steps:["Espalda contra pared","Brazo izq arriba, der 90°","Desplaza costillas a cóncavo","Mantén 5-8 respiraciones"],breathing:["Normal","INHALA — prepara","INHALA → cóncavo","EXHALA sss"],pose:"arms_up_side"},
  {name:"Rana en el Estanque",pos:"Boca abajo",lv:"Intermedio",desc:"Flexiona rodilla lado convexo. Presiona al suelo.",steps:["Boca abajo, frente en manos","Flexiona rodilla derecha","Presiona rodilla abajo","RAB costillas cóncavas"],breathing:["Normal","INHALA — flexiona","EXHALA — presiona","INHALA → cóncavo"],pose:"prone_frog"},
  {name:"Autocorrección Sentada ⭐",pos:"En silla",lv:"Básico",desc:"MÁS IMPORTANTE. Cojín bajo nalga convexo.",steps:["Cojín bajo nalga derecha","Elonga columna","Desplaza tronco izquierda","Mantén siempre"],breathing:["","INHALA — elonga","EXHALA — corrige","Normal"],pose:"sit"},
  {name:"Side-Shift en Pared",pos:"Lateral",lv:"Intermedio",desc:"Lado convexo contra pared con pelota.",steps:["Lado derecho a pared","Brazo izq arriba","Empuja costillas","RAB izquierdas"],breathing:["Normal","INHALA — prepara","EXHALA — empuja","INHALA → cóncavo"],pose:"side_stretch"},
  {name:"Respiración RAB 🔑",pos:"De lado",lv:"Clave",desc:"LO MÁS IMPORTANTE. Lado cóncavo arriba.",steps:["De lado izquierdo","Mano en costillas izq","Inhala profundo ahí","Exhala lento sss"],breathing:["Normal","Prepara","INHALA → costillas","EXHALA sss"],pose:"side_lying"},
  {name:"Ejercicio de la Puerta",pos:"Marco",lv:"Básico+",desc:"Manos al marco, paso atrás.",steps:["Sujeta marco","Paso atrás, elonga","Desplaza izquierda","Mantén 5-8 resp"],breathing:["Normal","INHALA — elonga","EXHALA — desplaza","INHALA RAB"],pose:"door_stretch"},
  {name:"Pelota Suiza",pos:"Sobre pelota",lv:"Intermedio",desc:"Inestabilidad activa musculatura profunda.",steps:["Sienta en pelota","Elonga, activa core","Desplaza pelvis izq","Mantén equilibrio"],breathing:["Normal","INHALA — elonga","EXHALA — desplaza","INHALA RAB"],pose:"ball"}
];

let scene, camera, renderer, controls, clock;
let model, mixer;
let bones = {};
let currentExercise = 0;
let isPaused = false;
let phaseTimer = 0;
let currentPhase = 0;
const PHASE_DURATION = 10;

let completedToday = new Set();
let streakDays = 0;

async function init() {
  loadProgress();
  setupScene();
  await loadModel();
  setupKeyboard();
  window.addEventListener('resize', onWindowResize);
  selectExercise(0);
  animate();

  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
    document.getElementById('app').style.opacity = '1';
  }, 500);
}

function setupScene() {
  const container = document.getElementById('canvas-container');
  const canvas = document.getElementById('canvas');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a0f2e);
  scene.fog = new THREE.Fog(0x1a0f2e, 10, 20);

  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(0, 1.6, 4.5);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 1.3, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 2.5;
  controls.maxDistance = 8;
  controls.maxPolarAngle = Math.PI / 2 + 0.3;
  controls.update();

  scene.add(new THREE.AmbientLight(0xb8a6d9, 0.9));

  const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
  mainLight.position.set(5, 8, 4);
  mainLight.castShadow = true;
  mainLight.shadow.mapSize.set(2048, 2048);
  scene.add(mainLight);

  const fillLight = new THREE.DirectionalLight(0x9d7dca, 0.6);
  fillLight.position.set(-4, 4, -3);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0xe879f9, 0.7);
  rimLight.position.set(0, 2, -4);
  scene.add(rimLight);

  clock = new THREE.Clock();

  buildRoom();
}

function buildRoom() {
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(12, 12),
    new THREE.MeshStandardMaterial({ color: 0x9b7653, roughness: 0.9 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  const wallMat = new THREE.MeshStandardMaterial({ color: 0xe8ddd0, roughness: 0.95 });

  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
  backWall.position.set(0, 2.5, -5);
  backWall.receiveShadow = true;
  scene.add(backWall);

  const sideWall = new THREE.Mesh(new THREE.PlaneGeometry(12, 5), wallMat);
  sideWall.position.set(-6, 2.5, 0);
  sideWall.rotation.y = Math.PI / 2;
  sideWall.receiveShadow = true;
  scene.add(sideWall);

  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 32, 32),
    new THREE.MeshStandardMaterial({ color: 0x9b7fc7, roughness: 0.4 })
  );
  ball.position.set(3, 0.4, 2);
  ball.castShadow = true;
  scene.add(ball);

  const mat = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 0.03, 2.2),
    new THREE.MeshStandardMaterial({ color: 0x7c3aed, roughness: 0.8 })
  );
  mat.position.set(0, 0.015, 0);
  mat.castShadow = true;
  scene.add(mat);
}

async function loadModel() {
  return new Promise((resolve, reject) => {
    const progressBar = document.getElementById('progress-bar');
    const loadingText = document.getElementById('loading-text');

    const loader = new THREE.GLTFLoader();

    loader.load(
      'models/Michelle.glb',
      (gltf) => {
        progressBar.style.width = '100%';
        loadingText.textContent = 'Configurando animaciones...';

        model = gltf.scene;
        model.scale.set(1, 1, 1);
        model.position.set(0, 0, 0);

        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;

            // Aclarar tez del personaje
            if (child.material) {
              if (child.material.map) {
                // Si tiene textura, aumentar brillo
                child.material.color.setRGB(1.3, 1.3, 1.3);
              }
              child.material.needsUpdate = true;
            }
          }

          // Find bones
          if (child.isSkinnedMesh && child.skeleton) {
            child.skeleton.bones.forEach(bone => {
              const n = bone.name.toLowerCase();

              // Common bone name patterns (Mixamo, Blender, etc)
              if (n.includes('hips') || n.includes('pelvis')) bones.hips = bone;
              if (n.includes('spine') && !n.includes('2') && !n.includes('3')) bones.spine = bone;
              if (n.includes('spine1') || (n.includes('spine') && n.includes('1'))) bones.spine1 = bone;
              if (n.includes('spine2') || (n.includes('spine') && n.includes('2'))) bones.spine2 = bone;
              if (n.includes('neck')) bones.neck = bone;
              if (n.includes('head') && !n.includes('top')) bones.head = bone;

              // Arms
              if ((n.includes('left') || n.includes('l')) && (n.includes('shoulder') || n.includes('clavicle'))) bones.leftShoulder = bone;
              if ((n.includes('right') || n.includes('r')) && (n.includes('shoulder') || n.includes('clavicle'))) bones.rightShoulder = bone;
              if ((n.includes('left') || n.includes('l')) && n.includes('arm') && !n.includes('fore')) bones.leftArm = bone;
              if ((n.includes('right') || n.includes('r')) && n.includes('arm') && !n.includes('fore')) bones.rightArm = bone;
              if ((n.includes('left') || n.includes('l')) && n.includes('forearm')) bones.leftForeArm = bone;
              if ((n.includes('right') || n.includes('r')) && n.includes('forearm')) bones.rightForeArm = bone;

              // Legs
              if ((n.includes('left') || n.includes('l')) && (n.includes('upleg') || n.includes('thigh'))) bones.leftUpLeg = bone;
              if ((n.includes('right') || n.includes('r')) && (n.includes('upleg') || n.includes('thigh'))) bones.rightUpLeg = bone;
              if ((n.includes('left') || n.includes('l')) && n.includes('leg') && !n.includes('up')) bones.leftLeg = bone;
              if ((n.includes('right') || n.includes('r')) && n.includes('leg') && !n.includes('up')) bones.rightLeg = bone;
            });

            console.log('✅ Bones detectados:', Object.keys(bones));
          }
        });

        scene.add(model);
        loadingText.textContent = '¡Listo! 💜';

        setTimeout(resolve, 300);
      },
      (progress) => {
        const percent = (progress.loaded / progress.total * 100).toFixed(0);
        progressBar.style.width = percent + '%';
        loadingText.textContent = `Cargando modelo... ${percent}%`;
      },
      reject
    );
  });
}

// Pose animations
const poses = {
  neutral: () => {
    // Reset all
    Object.values(bones).forEach(b => {
      if (b) {
        b.rotation.x = 0;
        b.rotation.y = 0;
        b.rotation.z = 0;
      }
    });
  },

  stand: () => {
    poses.neutral();
    // Slight elongation
    if (bones.spine1) bones.spine1.rotation.x = -0.02;
    if (bones.neck) bones.neck.rotation.x = -0.05;
  },

  arms_up_side: () => {
    poses.neutral();
    // Left arm up
    if (bones.leftShoulder) bones.leftShoulder.rotation.z = -0.3;
    if (bones.leftArm) bones.leftArm.rotation.z = -1.2;
    // Right arm 90°
    if (bones.rightArm) bones.rightArm.rotation.x = -0.8;
    // Slight spine rotation
    if (bones.spine1) bones.spine1.rotation.z = -0.1;
  },

  prone_frog: () => {
    poses.neutral();
    // Lie down (tilt model)
    if (bones.hips) bones.hips.rotation.x = Math.PI * 0.45;
    // Right leg frog
    if (bones.rightUpLeg) bones.rightUpLeg.rotation.z = 0.6;
    if (bones.rightLeg) bones.rightLeg.rotation.z = -0.8;
  },

  sit: () => {
    poses.neutral();
    // Sitting position
    if (bones.hips) bones.hips.rotation.x = 0.3;
    if (bones.leftUpLeg) bones.leftUpLeg.rotation.x = -1.2;
    if (bones.rightUpLeg) bones.rightUpLeg.rotation.x = -1.2;
    if (bones.leftLeg) bones.leftLeg.rotation.x = 1.2;
    if (bones.rightLeg) bones.rightLeg.rotation.x = 1.2;
    // Slight sideways
    if (bones.spine1) bones.spine1.rotation.z = -0.15;
  },

  side_stretch: () => {
    poses.neutral();
    // Left arm up
    if (bones.leftArm) bones.leftArm.rotation.z = -1.5;
    // Lean
    if (bones.spine1) bones.spine1.rotation.z = -0.2;
    if (bones.spine2) bones.spine2.rotation.z = -0.15;
  },

  side_lying: () => {
    poses.neutral();
    // Rotate entire model
    if (bones.hips) {
      bones.hips.rotation.z = -Math.PI * 0.45;
      bones.hips.rotation.x = 0.2;
    }
    // Hand to ribs
    if (bones.leftArm) bones.leftArm.rotation.y = -0.5;
    if (bones.leftForeArm) bones.leftForeArm.rotation.y = 0.8;
  },

  door_stretch: () => {
    poses.neutral();
    // Both arms forward
    if (bones.leftArm) bones.leftArm.rotation.x = -0.8;
    if (bones.rightArm) bones.rightArm.rotation.x = -0.8;
    // Lean forward
    if (bones.spine1) bones.spine1.rotation.x = 0.2;
  },

  ball: () => {
    poses.neutral();
    // Sitting
    if (bones.leftUpLeg) bones.leftUpLeg.rotation.x = -1.2;
    if (bones.rightUpLeg) bones.rightUpLeg.rotation.x = -1.2;
    if (bones.leftLeg) bones.leftLeg.rotation.x = 1.2;
    if (bones.rightLeg) bones.rightLeg.rotation.x = 1.2;
    // Left arm up
    if (bones.leftArm) bones.leftArm.rotation.z = -1.3;
    // Slight tilt
    if (bones.spine1) bones.spine1.rotation.z = -0.1;
  }
};

function applyPose(poseName) {
  if (poses[poseName]) {
    poses[poseName]();
  }
}

function loadProgress() {
  try {
    const today = new Date().toDateString();
    const lastDate = localStorage.getItem('constanza_last_date');

    if (lastDate === today) {
      const saved = localStorage.getItem('constanza_progress');
      if (saved) completedToday = new Set(JSON.parse(saved));
    } else {
      completedToday = new Set();
      localStorage.setItem('constanza_progress', JSON.stringify([]));
      localStorage.setItem('constanza_last_date', today);
    }

    streakDays = parseInt(localStorage.getItem('constanza_streak')) || 0;
  } catch (e) {}
  updateProgressUI();
}

function saveProgress() {
  try {
    localStorage.setItem('constanza_progress', JSON.stringify([...completedToday]));
  } catch (e) {}
}

function updateProgressUI() {
  document.getElementById('progress-stat').textContent = `${completedToday.size}/8 hoy`;
  document.getElementById('streak-stat').textContent = `${streakDays} día${streakDays !== 1 ? 's' : ''}`;

  const dotsContainer = document.getElementById('progress-dots');
  dotsContainer.innerHTML = '';
  for (let i = 0; i < 8; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot';
    if (i === currentExercise) dot.classList.add('active');
    else if (completedToday.has(i)) dot.classList.add('completed');
    dot.onclick = () => selectExercise(i);
    dotsContainer.appendChild(dot);
  }
}

function markComplete() {
  completedToday.add(currentExercise);
  saveProgress();
  updateProgressUI();

  const btn = document.getElementById('complete-btn');
  btn.classList.add('complete');
  btn.textContent = '✓ Completado!';

  setTimeout(() => {
    btn.classList.remove('complete');
    btn.textContent = '✓ Completar';
  }, 2500);
}

function selectExercise(index) {
  currentExercise = index;
  currentPhase = 0;
  phaseTimer = 0;

  const ex = EXERCISES[index];

  document.getElementById('hud-exercise').textContent = `${index + 1}. ${ex.name}`;
  document.getElementById('hud-phase').textContent = `Fase 1 de ${ex.steps.length}`;
  updateBreathing();

  document.getElementById('panel-title').textContent = ex.name;
  document.getElementById('panel-subtitle').textContent = `${ex.pos} • ${ex.lv}`;
  document.getElementById('exercise-description').textContent = ex.desc;

  const stepsList = document.getElementById('steps-list');
  stepsList.innerHTML = '';
  ex.steps.forEach(step => {
    const li = document.createElement('li');
    li.textContent = step;
    stepsList.appendChild(li);
  });

  updateProgressUI();

  // Apply pose
  applyPose(ex.pose);
}

function previousExercise() {
  selectExercise((currentExercise - 1 + EXERCISES.length) % EXERCISES.length);
}

function nextExercise() {
  selectExercise((currentExercise + 1) % EXERCISES.length);
}

function updateBreathing() {
  const ex = EXERCISES[currentExercise];
  const breathingDiv = document.getElementById('hud-breathing');
  const breathText = ex.breathing[currentPhase] || '';

  breathingDiv.textContent = breathText;
  breathingDiv.className = 'hud-breathing';

  if (breathText.includes('INHALA')) {
    breathingDiv.classList.add('inhale');
  } else if (breathText.includes('EXHALA')) {
    breathingDiv.classList.add('exhale');
  }
}

function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('pause-btn');
  btn.textContent = isPaused ? '▶ Continuar' : '⏸ Pausar';
  btn.classList.toggle('active', isPaused);
}

function resetCamera() {
  controls.reset();
  camera.position.set(0, 1.6, 4.5);
  controls.target.set(0, 1.3, 0);
  controls.update();
}

function togglePanel() {
  document.getElementById('bottom-panel').classList.toggle('collapsed');
}

function setupKeyboard() {
  window.addEventListener('keydown', (e) => {
    switch(e.key) {
      case 'ArrowLeft': previousExercise(); break;
      case 'ArrowRight': nextExercise(); break;
      case ' ': e.preventDefault(); togglePause(); break;
      case 'r': case 'R': resetCamera(); break;
      case 'f': case 'F':
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
        break;
    }
  });
}

function onWindowResize() {
  const container = document.getElementById('canvas-container');
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();
  const elapsed = clock.elapsedTime;

  if (!isPaused) {
    phaseTimer += delta;

    const ex = EXERCISES[currentExercise];

    if (phaseTimer >= PHASE_DURATION) {
      currentPhase = (currentPhase + 1) % ex.steps.length;
      phaseTimer = 0;

      document.getElementById('hud-phase').textContent = `Fase ${currentPhase + 1} de ${ex.steps.length}`;
      updateBreathing();
    }

    const remaining = Math.max(0, PHASE_DURATION - phaseTimer);
    const mins = Math.floor(remaining / 60);
    const secs = Math.floor(remaining % 60);
    document.getElementById('hud-timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

    // Breathing animation
    if (model) {
      const breathCycle = Math.sin(elapsed * 1.5) * 0.5 + 0.5;
      const breathScale = 1 + breathCycle * 0.015;
      model.scale.set(breathScale, 1, breathScale);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

init();
</script>

</body>
</html>
