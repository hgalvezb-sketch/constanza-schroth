<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constanza · Ejercicios Schroth</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: #0f0a1e;
  color: #e0e0e0;
  overflow: hidden;
}

/* Splash Screen */
#splash {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #0f0a1e 0%, #1a0f2e 50%, #2d1b4e 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.8s ease-out;
}

#splash.hide {
  opacity: 0;
  pointer-events: none;
}

.splash-content {
  text-align: center;
  animation: fadeInUp 0.8s ease-out;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.splash-content h1 {
  font-size: 32px;
  font-weight: 700;
  background: linear-gradient(135deg, #7c3aed, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 16px;
}

.splash-content p {
  font-size: 16px;
  color: #a78bfa;
  margin-bottom: 24px;
}

.heart {
  display: inline-block;
  color: #c084fc;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.loader {
  width: 40px;
  height: 40px;
  border: 3px solid #2d1b4e;
  border-top-color: #7c3aed;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Main App */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  opacity: 0;
  transition: opacity 0.5s ease-in;
}

#app.show {
  opacity: 1;
}

/* Header */
header {
  background: linear-gradient(135deg, #1a0f2e, #2d1b4e);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #3d2b5e;
  flex-shrink: 0;
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-left h1 {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, #7c3aed, #c084fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.progress-dots {
  display: flex;
  gap: 6px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #2d1b4e;
  transition: all 0.3s;
}

.dot.active {
  background: #7c3aed;
  box-shadow: 0 0 8px #7c3aed;
}

.dot.completed {
  background: #10b981;
  box-shadow: 0 0 8px #10b981;
}

.header-stats {
  display: flex;
  gap: 12px;
}

.stat {
  font-size: 12px;
  padding: 4px 12px;
  background: #1a0f2e;
  border-radius: 16px;
  border: 1px solid #3d2b5e;
}

.stat.completed-stat {
  color: #10b981;
  border-color: #10b981;
}

.stat.streak-stat {
  color: #c084fc;
  border-color: #7c3aed;
}

/* Canvas Container */
#canvas-container {
  flex: 1;
  position: relative;
  overflow: hidden;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* HUD Overlay */
#hud {
  position: absolute;
  top: 20px;
  left: 20px;
  background: rgba(15, 10, 30, 0.85);
  backdrop-filter: blur(12px);
  padding: 16px 20px;
  border-radius: 16px;
  border: 1px solid rgba(124, 58, 237, 0.3);
  max-width: 320px;
  pointer-events: none;
}

.hud-exercise {
  font-size: 20px;
  font-weight: 700;
  color: #c084fc;
  margin-bottom: 8px;
}

.hud-phase {
  font-size: 14px;
  color: #a78bfa;
  margin-bottom: 12px;
}

.hud-breathing {
  font-size: 16px;
  font-weight: 600;
  padding: 8px 12px;
  border-radius: 8px;
  margin-bottom: 12px;
}

.hud-breathing.inhale {
  background: rgba(16, 185, 129, 0.2);
  color: #10b981;
  border: 1px solid rgba(16, 185, 129, 0.3);
}

.hud-breathing.exhale {
  background: rgba(251, 146, 60, 0.2);
  color: #fb923c;
  border: 1px solid rgba(251, 146, 60, 0.3);
}

.hud-timer {
  font-size: 32px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #7c3aed;
  text-align: center;
}

/* Control Panel */
#controls {
  position: absolute;
  top: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.ctrl-btn {
  padding: 10px 16px;
  background: rgba(15, 10, 30, 0.85);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(124, 58, 237, 0.3);
  border-radius: 12px;
  color: #a78bfa;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
  min-width: 140px;
  text-align: center;
}

.ctrl-btn:hover {
  background: rgba(124, 58, 237, 0.2);
  border-color: #7c3aed;
  color: #c084fc;
}

.ctrl-btn.active {
  background: #7c3aed;
  color: #fff;
  border-color: #7c3aed;
}

.ctrl-btn.complete {
  background: #10b981;
  color: #fff;
  border-color: #10b981;
}

/* Bottom Panel */
#bottom-panel {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(15, 10, 30, 0.95);
  backdrop-filter: blur(16px);
  border-top: 1px solid rgba(124, 58, 237, 0.3);
  transition: transform 0.3s ease-out;
}

#bottom-panel.collapsed {
  transform: translateY(calc(100% - 60px));
}

.panel-handle {
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  cursor: pointer;
  user-select: none;
}

.panel-title {
  font-size: 16px;
  font-weight: 600;
  color: #c084fc;
}

.panel-subtitle {
  font-size: 13px;
  color: #7c3aed;
  margin-left: 12px;
}

.panel-toggle {
  font-size: 20px;
  color: #7c3aed;
  transition: transform 0.3s;
}

#bottom-panel.collapsed .panel-toggle {
  transform: rotate(180deg);
}

.panel-content {
  padding: 0 24px 24px;
  max-height: 200px;
  overflow-y: auto;
}

.panel-content::-webkit-scrollbar {
  width: 4px;
}

.panel-content::-webkit-scrollbar-thumb {
  background: #7c3aed;
  border-radius: 2px;
}

.exercise-description {
  font-size: 14px;
  line-height: 1.6;
  color: #a78bfa;
  margin-bottom: 16px;
}

.steps-list {
  list-style: none;
  counter-reset: step;
}

.steps-list li {
  counter-increment: step;
  position: relative;
  padding-left: 32px;
  margin-bottom: 8px;
  font-size: 13px;
  color: #8b7fc8;
}

.steps-list li::before {
  content: counter(step);
  position: absolute;
  left: 0;
  width: 24px;
  height: 24px;
  background: #2d1b4e;
  border: 1px solid #7c3aed;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #7c3aed;
}

/* Navigation Arrows */
.nav-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 48px;
  height: 48px;
  background: rgba(15, 10, 30, 0.85);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(124, 58, 237, 0.3);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: #7c3aed;
  font-size: 24px;
  transition: all 0.2s;
  user-select: none;
  z-index: 50;
}

.nav-arrow:hover {
  background: rgba(124, 58, 237, 0.3);
  border-color: #7c3aed;
  transform: translateY(-50%) scale(1.1);
}

.nav-arrow.left {
  left: 20px;
}

.nav-arrow.right {
  right: 20px;
}

/* Responsive */
@media (max-width: 768px) {
  header {
    padding: 8px 16px;
  }

  .header-left h1 {
    font-size: 14px;
  }

  .header-stats {
    display: none;
  }

  #hud {
    top: 10px;
    left: 10px;
    right: 10px;
    max-width: none;
    padding: 12px 16px;
  }

  #controls {
    flex-direction: row;
    top: auto;
    bottom: 280px;
    right: 10px;
    left: 10px;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    flex: 1;
    min-width: 100px;
  }

  .nav-arrow {
    display: none;
  }
}

/* Loading State */
.loading {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.loading-spinner {
  width: 60px;
  height: 60px;
  border: 4px solid #2d1b4e;
  border-top-color: #7c3aed;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}

.loading-text {
  font-size: 14px;
  color: #7c3aed;
}
</style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <div class="splash-content">
    <h1>Hola Constanza <span class="heart">💜</span></h1>
    <p>Aquí están tus ejercicios Schroth — hazlos todos los días</p>
    <div class="loader"></div>
  </div>
</div>

<!-- Main App -->
<div id="app">
  <!-- Header -->
  <header>
    <div class="header-left">
      <h1>Constanza</h1>
      <div class="progress-dots" id="progress-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
    <div class="header-stats">
      <div class="stat completed-stat" id="progress-stat">0/8 hoy</div>
      <div class="stat streak-stat" id="streak-stat">0 días</div>
      <div class="stat">←→ SPACE R F</div>
    </div>
  </header>

  <!-- Canvas Container -->
  <div id="canvas-container">
    <canvas id="canvas"></canvas>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Cargando modelo 3D...</div>
    </div>

    <!-- HUD -->
    <div id="hud" style="display:none;">
      <div class="hud-exercise" id="hud-exercise">Ejercicio</div>
      <div class="hud-phase" id="hud-phase">Fase 1 de 4</div>
      <div class="hud-breathing" id="hud-breathing"></div>
      <div class="hud-timer" id="hud-timer">10:00</div>
    </div>

    <!-- Controls -->
    <div id="controls">
      <button class="ctrl-btn" id="pause-btn" onclick="togglePause()">⏸ Pausar</button>
      <button class="ctrl-btn" id="complete-btn" onclick="markComplete()">✓ Completar</button>
      <button class="ctrl-btn" id="reset-btn" onclick="resetCamera()">↻ Reset</button>
      <button class="ctrl-btn" id="mirror-btn" onclick="toggleMirror()">🪞 Espejo</button>
    </div>

    <!-- Navigation Arrows -->
    <div class="nav-arrow left" onclick="previousExercise()">‹</div>
    <div class="nav-arrow right" onclick="nextExercise()">›</div>

    <!-- Bottom Panel -->
    <div id="bottom-panel">
      <div class="panel-handle" onclick="togglePanel()">
        <div>
          <span class="panel-title" id="panel-title">Selecciona un ejercicio</span>
          <span class="panel-subtitle" id="panel-subtitle"></span>
        </div>
        <span class="panel-toggle">▼</span>
      </div>
      <div class="panel-content">
        <p class="exercise-description" id="exercise-description">
          Usa las flechas ← → para navegar entre ejercicios. Arrastra para rotar la vista, scroll para zoom.
        </p>
        <ol class="steps-list" id="steps-list"></ol>
      </div>
    </div>
  </div>
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/examples/js/controls/OrbitControls.js"></script>

<script>
// Exercise Data
const EXERCISES = [
  {
    name: "Elongación Axial",
    position: "De pie",
    level: "Básico",
    description: "Base del método. De pie frente al espejo, imagina un hilo desde la coronilla. Crece hacia arriba sin ponerte de puntas. Mentón recogido, abdomen activo al 30%.",
    steps: [

    ],
    breathing: ["", "INHALA — crece", "Mantén elongación", "EXHALA — sostén"]
  },
  {

  {
    name: "Rana en el Estanque",
    position: "Boca abajo",
    level: "Intermedio",
    description: "Boca abajo, flexiona rodilla del lado convexo como rana. Presiona rodilla al suelo activando iliopsoas para desrotar pelvis.",
    steps: [
      "Acuéstate boca abajo, frente sobre manos cruzadas",
      "Flexiona rodilla derecha en posición de rana",
      "Presiona rodilla hacia el suelo firmemente",
      "Aplica RAB expandiendo costillas cóncavas"
    ],
    breathing: ["Normal", "INHALA — flexiona", "EXHALA — presiona", "INHALA → cóncavo"]
  },
  {
    name: "Autocorrección Sentada ⭐",
    position: "En silla",
    level: "Básico",
    description: "EL MÁS IMPORTANTE para vida diaria. Cojín bajo nalga del lado convexo para nivelar pelvis. Elonga y desplaza tronco al cóncavo. Practicar TODO el día.",
    steps: [
      "Siéntate con cojín bajo nalga derecha (lado convexo)",
      "Elonga la columna como en ejercicio 1",
      "Desplaza tronco hacia la izquierda (lado cóncavo)",
      "Mantén esta postura durante tareas: escuela, tarea, comida"
    ],
    breathing: ["", "INHALA — elonga", "EXHALA — corrige", "Respiración normal"]
  },
  {
    name: "Side-Shift en Pared",
    position: "Lateral a pared",
    level: "Intermedio",
    description: "Lado convexo contra pared con pelota en costillas. Brazo superior extendido. Empuja costillas contra pelota mientras tronco se aleja.",
    steps: [
      "De pie con lado derecho contra pared, pelota en costillas",
      "Brazo izquierdo extendido hacia arriba",
      "Empuja costillas contra pelota, tronco se aleja de pared",
      "RAB expandiendo costillas izquierdas"
    ],
    breathing: ["Normal", "INHALA — prepara", "EXHALA — empuja", "INHALA → cóncavo"]
  },
  {
    name: "Respiración RAB 🔑",
    position: "De lado",
    level: "Clave",
    description: "Lo MÁS importante del método. Acostada con lado cóncavo arriba. Mano en costillas cóncavas. Inhala dirigiendo aire SOLO ahí.",
    steps: [
      "Acuéstate de lado izquierdo (cóncavo arriba)",
      "Coloca mano sobre costillas izquierdas",
      "Inhala profundamente dirigiendo aire solo a esa zona",
      "Exhala lentamente con 'sss', mantén expansión"
    ],
    breathing: ["Normal", "Prepara", "INHALA profundo → costillas", "EXHALA sss... lento"]
  },
  {
    name: "Ejercicio de la Puerta",
    position: "Marco de puerta",
    level: "Básico+",
    description: "Ambas manos al marco, paso atrás. La gravedad elonga la columna creando espacio entre vértebras. Desplaza tronco al lado cóncavo.",
    steps: [
      "Sujeta marco de puerta con ambas manos a altura de hombros",
      "Da un paso atrás, deja que gravedad elonga tu columna",
      "Desplaza tronco hacia lado izquierdo (cóncavo)",
      "Mantén con RAB, 5-8 respiraciones"
    ],
    breathing: ["Normal", "INHALA — deja elongar", "EXHALA — desplaza", "INHALA RAB"]
  },
  {
    name: "Pelota Suiza",
    position: "Sobre pelota",
    level: "Intermedio",
    description: "La inestabilidad de la pelota activa musculatura profunda automáticamente. Elonga, desplaza pelvis al cóncavo. Avanzado: brazo cóncavo arriba.",
    steps: [
      "Siéntate sobre pelota suiza, pies firmes en suelo",
      "Elonga columna, activa core",
      "Desplaza pelvis hacia izquierda, brazo izquierdo arriba",
      "Mantén equilibrio con RAB, 5-8 respiraciones"
    ],
    breathing: ["Normal", "INHALA — elonga", "EXHALA — desplaza", "INHALA RAB"]
  }
];

// Global State
let scene, camera, renderer, controls, clock;
let model, mixer, currentAction;
let currentExercise = 0;
let isPaused = false;
let phaseTimer = 0;
let currentPhase = 0;
const PHASE_DURATION = 10;

// Progress Tracking
let completedToday = new Set();
let streakDays = 0;
const STORAGE_KEY = 'constanza_schroth_progress';
const LAST_DATE_KEY = 'constanza_schroth_last_date';
const STREAK_KEY = 'constanza_schroth_streak';

// Mirror
let mirrorMesh;
let mirrorEnabled = true;

// Room objects
let room = {};

// Initialize
async function init() {
  // Load progress
  loadProgress();

  // Setup Three.js
  const container = document.getElementById('canvas-container');
  const canvas = document.getElementById('canvas');

  // Scene
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a0f2e);
  scene.fog = new THREE.Fog(0x1a0f2e, 8, 15);

  // Camera
  camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(0, 1.6, 3);

  // Renderer
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;

  // Controls
  controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 1.2, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 1.5;
  controls.maxDistance = 6;
  controls.maxPolarAngle = Math.PI / 2 + 0.2;
  controls.update();

  // Lights
  const ambientLight = new THREE.AmbientLight(0xb8a6d9, 0.6);
  scene.add(ambientLight);

  const mainLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
  mainLight.position.set(4, 6, 3);
  mainLight.castShadow = true;
  mainLight.shadow.mapSize.set(2048, 2048);
  mainLight.shadow.camera.near = 0.5;
  mainLight.shadow.camera.far = 15;
  mainLight.shadow.camera.left = -4;
  mainLight.shadow.camera.right = 4;
  mainLight.shadow.camera.top = 4;
  mainLight.shadow.camera.bottom = -4;
  scene.add(mainLight);

  const fillLight = new THREE.DirectionalLight(0x9d7dca, 0.3);
  fillLight.position.set(-3, 3, -2);
  scene.add(fillLight);

  const accentLight = new THREE.PointLight(0x7c3aed, 0.4, 8);
  accentLight.position.set(0, 2.5, 0);
  scene.add(accentLight);

  // Build room
  buildRoom();

  // Load model
  await loadModel();

  // Setup keyboard
  setupKeyboard();

  // Resize handler
  window.addEventListener('resize', onWindowResize);

  // Clock
  clock = new THREE.Clock();

  // Start animation
  animate();

  // Hide splash, show app
  setTimeout(() => {
    document.getElementById('splash').classList.add('hide');
    document.getElementById('app').classList.add('show');
    document.getElementById('hud').style.display = 'block';
    selectExercise(0);
  }, 3000);
}

// Build room
function buildRoom() {
  // Floor - warm wood
  const floorGeometry = new THREE.PlaneGeometry(10, 10);
  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x9b7653,
    roughness: 0.9,
    metalness: 0.0
  });
  const floor = new THREE.Mesh(floorGeometry, floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Walls - warm cream
  const wallMaterial = new THREE.MeshStandardMaterial({
    color: 0xe8ddd0,
    roughness: 0.95
  });

  // Back wall
  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 4), wallMaterial);
  backWall.position.set(0, 2, -4);
  backWall.receiveShadow = true;
  scene.add(backWall);

  // Side wall
  const sideWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 4), wallMaterial);
  sideWall.position.set(-5, 2, 0);
  sideWall.rotation.y = Math.PI / 2;
  sideWall.receiveShadow = true;
  scene.add(sideWall);

  // Mirror - full body
  const mirrorFrame = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 2.4, 0.08),
    new THREE.MeshStandardMaterial({ color: 0x3a2f2a, roughness: 0.5, metalness: 0.3 })
  );
  mirrorFrame.position.set(-4.9, 1.6, 1);
  mirrorFrame.rotation.y = Math.PI / 2;
  scene.add(mirrorFrame);

  const mirrorSurface = new THREE.Mesh(
    new THREE.PlaneGeometry(1.4, 2.2),
    new THREE.MeshStandardMaterial({
      color: 0xc8d8e8,
      roughness: 0.1,
      metalness: 0.9,
      envMapIntensity: 1.0
    })
  );
  mirrorSurface.position.set(-4.85, 1.6, 1);
  mirrorSurface.rotation.y = Math.PI / 2;
  mirrorMesh = mirrorSurface;
  scene.add(mirrorSurface);

  // Swiss ball - purple/lilac
  const ballGeometry = new THREE.SphereGeometry(0.35, 32, 32);
  const ballMaterial = new THREE.MeshStandardMaterial({
    color: 0x9b7fc7,
    roughness: 0.5,
    metalness: 0.1
  });
  const ball = new THREE.Mesh(ballGeometry, ballMaterial);
  ball.position.set(2.5, 0.35, 1.5);
  ball.castShadow = true;
  scene.add(ball);
  room.ball = ball;

  // Yoga mat - purple
  const matGeometry = new THREE.BoxGeometry(0.8, 0.02, 2.0);
  const matMaterial = new THREE.MeshStandardMaterial({
    color: 0x7c3aed,
    roughness: 0.85
  });
  const mat = new THREE.Mesh(matGeometry, matMaterial);
  mat.position.set(0, 0.01, 0);
  mat.castShadow = true;
  mat.receiveShadow = true;
  scene.add(mat);
  room.mat = mat;

  // Chair - simple wooden
  const chairSeat = new THREE.Mesh(
    new THREE.BoxGeometry(0.45, 0.04, 0.45),
    new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.7 })
  );
  chairSeat.position.set(-2, 0.5, -1);
  chairSeat.castShadow = true;
  scene.add(chairSeat);

  const chairBack = new THREE.Mesh(
    new THREE.BoxGeometry(0.45, 0.6, 0.04),
    new THREE.MeshStandardMaterial({ color: 0x8b6f47, roughness: 0.7 })
  );
  chairBack.position.set(-2, 0.8, -1.225);
  chairBack.castShadow = true;
  scene.add(chairBack);

  room.chair = { seat: chairSeat, back: chairBack };
}

// Load GLTF model
async function loadModel() {
  const loading = document.getElementById('loading');

  try {
    const loader = new THREE.GLTFLoader();

    // Michelle.glb - Female character model
    const gltf = await new Promise((resolve, reject) => {
      loader.load(
        'models/Michelle.glb',
        resolve,
        (progress) => {
          const percent = (progress.loaded / progress.total * 100).toFixed(0);
          loading.querySelector('.loading-text').textContent = `Cargando modelo... ${percent}%`;
        },
        reject
      );
    });

    model = gltf.scene;

    // Michelle.glb is typically larger, adjust scale
    model.scale.set(1.0, 1.0, 1.0);
    model.position.set(0, 0, 0);

    // Customize materials for Constanza
    model.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;

        if (child.material) {
          const name = child.name.toLowerCase();

          // Skin - Warm light tone
          if (name.includes('body') || name.includes('skin') || name.includes('head') ||
              name.includes('face') || name.includes('arm') || name.includes('leg')) {
            child.material = child.material.clone();
            child.material.color.setHex(0xd8a880);
            child.material.roughness = 0.6;
            child.material.metalness = 0.0;
          }

          // Hair - Black with blue tint
          else if (name.includes('hair')) {
            child.material = child.material.clone();
            child.material.color.setHex(0x1a0803);
            child.material.roughness = 0.85;
            child.material.metalness = 0.0;
          }

          // Top/Shirt - Purple
          else if (name.includes('top') || name.includes('shirt') || name.includes('torso')) {
            child.material = child.material.clone();
            child.material.color.setHex(0x7c3aed);
            child.material.roughness = 0.7;
            child.material.metalness = 0.0;
          }

          // Pants/Leggings - Black
          else if (name.includes('pants') || name.includes('legs') || name.includes('bottom')) {
            child.material = child.material.clone();
            child.material.color.setHex(0x1a1a1a);
            child.material.roughness = 0.6;
            child.material.metalness = 0.0;
          }

          // Shoes - White/Black
          else if (name.includes('shoe') || name.includes('foot')) {
            child.material = child.material.clone();
            child.material.color.setHex(0xf0f0f0);
            child.material.roughness = 0.5;
            child.material.metalness = 0.1;
          }

          // Eyes - Dark
          else if (name.includes('eye')) {
            child.material = child.material.clone();
            child.material.color.setHex(0x2d1508);
            child.material.roughness = 0.3;
            child.material.metalness = 0.0;
          }
        }
      }
    });

    scene.add(model);

    // Setup animations
    mixer = new THREE.AnimationMixer(model);

    if (gltf.animations && gltf.animations.length > 0) {
      // Use first animation as base
      currentAction = mixer.clipAction(gltf.animations[0]);
      currentAction.play();
    }

    loading.style.display = 'none';

  } catch (error) {
    console.error('Error loading model:', error);
    loading.querySelector('.loading-text').textContent = 'Error cargando modelo. Usando modo básico.';

    // Fallback: create simple humanoid
    createFallbackModel();
    loading.style.display = 'none';
  }
}

// Fallback model (simple humanoid)
function createFallbackModel() {
  const group = new THREE.Group();

  // Body
  const bodyGeometry = new THREE.CapsuleGeometry(0.25, 0.6, 8, 16);
  const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x7c3aed, roughness: 0.7 });
  const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
  body.position.y = 1.2;
  body.castShadow = true;
  group.add(body);

  // Head
  const headGeometry = new THREE.SphereGeometry(0.18, 16, 16);
  const headMaterial = new THREE.MeshStandardMaterial({ color: 0xd8a880, roughness: 0.6 });
  const head = new THREE.Mesh(headGeometry, headMaterial);
  head.position.y = 1.75;
  head.castShadow = true;
  group.add(head);

  model = group;
  scene.add(model);
}

// Progress tracking
function loadProgress() {
  try {
    const today = new Date().toDateString();
    const lastDate = localStorage.getItem(LAST_DATE_KEY);

    if (lastDate === today) {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        completedToday = new Set(JSON.parse(saved));
      }
    } else {
      if (lastDate) {
        const last = new Date(lastDate);
        const now = new Date();
        const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));

        if (diffDays === 1) {
          streakDays = (parseInt(localStorage.getItem(STREAK_KEY)) || 0) + 1;
          localStorage.setItem(STREAK_KEY, streakDays);
        } else if (diffDays > 1) {
          streakDays = 0;
          localStorage.setItem(STREAK_KEY, '0');
        }
      }

      completedToday = new Set();
      localStorage.setItem(STORAGE_KEY, JSON.stringify([]));
      localStorage.setItem(LAST_DATE_KEY, today);
    }

    streakDays = parseInt(localStorage.getItem(STREAK_KEY)) || 0;
  } catch (e) {
    console.error('Error loading progress:', e);
  }

  updateProgressUI();
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...completedToday]));
  } catch (e) {
    console.error('Error saving progress:', e);
  }
}

function updateProgressUI() {
  document.getElementById('progress-stat').textContent = `${completedToday.size}/8 hoy`;
  document.getElementById('streak-stat').textContent = `${streakDays} día${streakDays !== 1 ? 's' : ''}`;

  // Update dots
  const dots = document.querySelectorAll('.dot');
  dots.forEach((dot, i) => {
    dot.classList.remove('active', 'completed');
    if (i === currentExercise) {
      dot.classList.add('active');
    } else if (completedToday.has(i)) {
      dot.classList.add('completed');
    }
  });
}

function markComplete() {
  completedToday.add(currentExercise);
  saveProgress();
  updateProgressUI();

  const btn = document.getElementById('complete-btn');
  btn.classList.add('complete');
  btn.textContent = '✓ Completado!';

  setTimeout(() => {
    btn.classList.remove('complete');
    btn.textContent = '✓ Completar';
  }, 2000);
}

// Exercise selection
function selectExercise(index) {
  currentExercise = index;
  currentPhase = 0;
  phaseTimer = 0;

  const ex = EXERCISES[index];

  // Update HUD
  document.getElementById('hud-exercise').textContent = `${index + 1}. ${ex.name}`;
  document.getElementById('hud-phase').textContent = `Fase 1 de ${ex.steps.length}`;
  updateBreathing();

  // Update panel
  document.getElementById('panel-title').textContent = ex.name;
  document.getElementById('panel-subtitle').textContent = `${ex.position} • ${ex.level}`;
  document.getElementById('exercise-description').textContent = ex.description;

  const stepsList = document.getElementById('steps-list');
  stepsList.innerHTML = '';
  ex.steps.forEach(step => {
    const li = document.createElement('li');
    li.textContent = step;
    stepsList.appendChild(li);
  });

  updateProgressUI();

  // Reset camera for better viewing
  resetCamera();
}

function previousExercise() {
  selectExercise((currentExercise - 1 + EXERCISES.length) % EXERCISES.length);
}

function nextExercise() {
  selectExercise((currentExercise + 1) % EXERCISES.length);
}

function updateBreathing() {
  const ex = EXERCISES[currentExercise];
  const breathingDiv = document.getElementById('hud-breathing');
  const breathText = ex.breathing[currentPhase] || '';

  breathingDiv.textContent = breathText;
  breathingDiv.className = 'hud-breathing';

  if (breathText.includes('INHALA')) {
    breathingDiv.classList.add('inhale');
  } else if (breathText.includes('EXHALA')) {
    breathingDiv.classList.add('exhale');
  }
}

// Controls
function togglePause() {
  isPaused = !isPaused;
  const btn = document.getElementById('pause-btn');
  btn.textContent = isPaused ? '▶ Continuar' : '⏸ Pausar';
  btn.classList.toggle('active', isPaused);
}

function resetCamera() {
  controls.reset();
  camera.position.set(0, 1.6, 3);
  controls.target.set(0, 1.2, 0);
  controls.update();
}

function toggleMirror() {
  mirrorEnabled = !mirrorEnabled;
  if (mirrorMesh) {
    mirrorMesh.visible = mirrorEnabled;
  }
  const btn = document.getElementById('mirror-btn');
  btn.classList.toggle('active', !mirrorEnabled);
}

function togglePanel() {
  document.getElementById('bottom-panel').classList.toggle('collapsed');
}

// Keyboard
function setupKeyboard() {
  window.addEventListener('keydown', (e) => {
    switch(e.key) {
      case 'ArrowLeft':
        previousExercise();
        break;
      case 'ArrowRight':
        nextExercise();
        break;
      case ' ':
        e.preventDefault();
        togglePause();
        break;
      case 'r':
      case 'R':
        resetCamera();
        break;
      case 'f':
      case 'F':
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
        break;
    }
  });
}

// Resize
function onWindowResize() {
  const container = document.getElementById('canvas-container');
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
}

// Animation loop
function animate() {
  requestAnimationFrame(animate);

  const delta = clock.getDelta();

  if (!isPaused) {
    // Update timer
    phaseTimer += delta;

    const ex = EXERCISES[currentExercise];
    const phaseDuration = PHASE_DURATION;

    if (phaseTimer >= phaseDuration) {
      currentPhase = (currentPhase + 1) % ex.steps.length;
      phaseTimer = 0;

      document.getElementById('hud-phase').textContent = `Fase ${currentPhase + 1} de ${ex.steps.length}`;
      updateBreathing();
    }

    // Update timer display
    const remaining = Math.max(0, phaseDuration - phaseTimer);
    const mins = Math.floor(remaining / 60);
    const secs = Math.floor(remaining % 60);
    document.getElementById('hud-timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

    // Update animation mixer
    if (mixer) {
      mixer.update(delta);
    }

    // Subtle breathing animation on model
    if (model) {
      const breathScale = 1 + Math.sin(clock.elapsedTime * 2) * 0.01;
      if (model.scale) {
        model.scale.x = 0.6 * breathScale;
        model.scale.z = 0.6 * breathScale;
      }
    }
  }

  // Update controls
  controls.update();

  // Render
  renderer.render(scene, camera);
}

// Start
init();
</script>
